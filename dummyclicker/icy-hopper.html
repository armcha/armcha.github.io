<script src="arcade.js?v=111"></script>
<script src="debug.js?v=111"></script>
<script>
(function () {
  'use strict';

  // 540 x 960. Three times the original 180 x 320, and 1.5 times the 360 x 640
  // step before it. On a phone that is a little over two screen pixels per game
  // pixel, which is the most you can spend and still look like pixel art.
  // Every length here is a plain 1.5x of the 360x640 version, so the floor
  // geometry and the balance carry over unchanged.
  var U = 3;
  var W = 160 * U, H = 320 * U;      // 480 x 960: eight columns, see COLS

  // Eight columns, not nine. The block, the climber and every sprite keep their
  // pixels; the screen just holds one column fewer, so on a phone each logical
  // pixel is 540/480 = 1.125 times wider. That is the "zoom in about twelve
  // percent" - done by showing less, not by scaling art off its grid.
  var BW = 60, BH = 24, COLS = 8;   // one floor is 8 blocks of 60 x 24
  var ZONE_ROWS = 28;          // set from the ZONE LENGTH dial in setup()
  var PW = 30, PH = 45;             // collision box; the sprite is drawn on it
  var TW = 33, TH = 27;             // topi
  var HW = 27, HH = 18;             // hawk

  // ICE and ROCK keep their old ids so nothing else has to change. hits 0 means
  // it never breaks; solid false means you fall straight through it. weight and
  // drag decide how the pieces fall, so snow floats and rock drops hard.
  var EMPTY = 0, ICE = 1, ROCK = 2, PACKED = 3, BLUEICE = 4, CRACKED = 5,
      WOOD = 6, IRON = 7, POWDER = 8, CRATE = 9, GOLDORE = 10, SNOWCAP = 11,
      HOLLOW = 12, OBSIDIAN = 13, COAL = 14;

  var MAT = {};
  MAT[ICE]     = { name: 'ICE',         hits: 1, solid: true,  tone: 'iceTop',  weight: 1,    n: 7 };
  MAT[ROCK]    = { name: 'ROCK',        hits: 2, solid: true,  tone: 'rockTop', weight: 1.5,  n: 6,
                   pick: true, teach: 'NEEDS THE ICE PICK' };
  MAT[PACKED]  = { name: 'PACKED SNOW', hits: 1, solid: true,  tone: 'snow',    weight: 0.35, n: 9 };
  MAT[BLUEICE] = { name: 'BLUE ICE',    hits: 2, solid: true,  tone: 'iceEdge', weight: 1.3,  n: 6,
                   teach: 'TAKES TWO HITS' };
  MAT[CRACKED] = { name: 'CRACKED ICE', hits: 1, solid: true,  tone: 'iceTop',  weight: 1,    n: 8,
                   gives: true, teach: 'GIVES WAY UNDER YOU' };
  MAT[WOOD]    = { name: 'WOOD',        hits: 2, solid: true,  tone: 'strapLite', weight: 0.9, n: 6,
                   teach: 'TAKES TWO HITS' };
  MAT[IRON]    = { name: 'IRON',        hits: 0, solid: true,  tone: 'goldLight', weight: 1,  n: 5,
                   teach: 'NEVER BREAKS - GO ROUND' };
  MAT[POWDER]  = { name: 'POWDER SNOW', hits: 1, solid: false, tone: 'snow',    weight: 0.3,  n: 10,
                   teach: 'YOU FALL STRAIGHT THROUGH' };

  // The six below each add a rule, not just a colour. Two pay you for breaking
  // them, two lie about how hard they are, one takes its neighbours with it,
  // and one is simply the hardest thing on the mountain.
  MAT[CRATE]    = { name: 'CRATE',      hits: 1, solid: true, tone: 'strapLite', weight: 0.8, n: 8,
                    veg: true,  teach: 'BREAK IT FOR A VEGGIE' };
  MAT[GOLDORE]  = { name: 'GOLD ORE',   hits: 1, solid: true, tone: 'goldLight', weight: 1.4, n: 8,
                    bonus: 60,  teach: 'BREAK IT FOR POINTS' };
  MAT[SNOWCAP]  = { name: 'CAPPED ICE', hits: 2, solid: true, tone: 'snow',      weight: 1,   n: 7,
                    teach: 'SNOW ON TOP, ICE UNDER' };
  MAT[HOLLOW]   = { name: 'HOLLOW ICE', hits: 1, solid: true, tone: 'iceEdge',   weight: 0.9, n: 12,
                    chain: true, teach: 'BREAKS BOTH NEIGHBOURS' };
  MAT[OBSIDIAN] = { name: 'OBSIDIAN',   hits: 3, solid: true, tone: 'purpleLite',weight: 1.7, n: 7,
                    pick: true, teach: 'THREE HITS, PICK ONLY' };
  MAT[COAL]     = { name: 'COAL',       hits: 1, solid: true, tone: 'slateLite', weight: 1.2, n: 9,
                    teach: 'LOOKS HARD, BREAKS EASY' };

  function isSolid(t) { return !!t && MAT[t].solid; }

  var BONK = 0, CLIMB = 1, DRILL = 2, HAMMER = 3, FLIP = 4, STREAK = 5;
  var SMASH_DEFAULT = [390, 810, 690, 0, 390, 390];

  // Five climbers. The collision box stays 30 x 45 whichever you pick, so
  // swapping character never changes how the game plays - only the drawing
  // changes, and each sprite is placed feet-down inside that same box.
  var CHARS = [
    { name: 'PENGUIN', w: 30, h: 45 },
    { name: 'YETI CUB', w: 36, h: 44 },
    { name: 'SNOW ROBOT', w: 30, h: 47 },
    { name: 'MOUNTAIN GOAT', w: 44, h: 38 },
    { name: 'ASTRONAUT', w: 30, h: 46 }
  ];

  // Four steps, then the condor and back to the start. There is deliberately no
  // jump-height gear: the bounce has to clear exactly one floor and no more, so
  // raising it breaks the floor geometry the whole game is built on.
  var KIT = [
    { name: 'SNOW BOOTS', note: 'MOVE SIDEWAYS FASTER' },
    { name: 'ICE PICK',   note: 'BREAK ROCK TOO' },
    { name: 'FUR COAT',   note: 'SURVIVE ONE SNOW HIT' },
    { name: 'CONDOR!',    note: 'FLY UP FOR FREE' }
  ];
  var KIT_MAX = KIT.length;
  // The condor is the fourth piece and the reset of the whole loop. Off, the
  // kit stops at three and a full kit pays a bonus instead of a flight.
  function kitMax() { return T.condor ? KIT_MAX : KIT_MAX - 1; }
  var BEST_KEY = 'dc.kit.icy-hopper';

  // The bounce must clear one floor (rise > ROW_GAP) but never reach the
  // underside of the floor above that (PH + rise < 2 * ROW_GAP - BH).
  // ROW_GAP 120, BH 24, PH 45 leaves rise between 120 and 171; it is 150.
  var T = Debug.panel('icy-hopper', [
    { group: 'CHARACTER', key: 'chr', type: 'choice', value: 0,
      options: ['PENGUIN', 'YETI CUB', 'SNOW ROBOT', 'MOUNTAIN GOAT', 'ASTRONAUT'],
      notes: [
        'Belongs on ice with no explanation, and black against a white belly is the strongest silhouette of the five. The scarf arrives with the boots and the feet turn gold.',
        'A small shaggy snow creature, blue-grey on purpose so it never disappears into the snow. The widest body, so the gear has the most room to sit on it.',
        'The only one where an upgrade chain is literally what it is for. The glowing visor is a single bright point that stays visible while it moves.',
        'Four legs, so instantly unlike everything else, and climbing is what a goat does. The horns give it a shape nothing else here has.',
        'A round helmet is the most readable head shape there is, and the visor carries expression by reflection alone.'
      ] },

    // SMASH + CLIMB is the default: you break the ice and carry straight on up
    // onto that floor, with no second jump. BONK + DROP is still in the list.
    { group: 'CORE MECHANIC', key: 'mech', type: 'choice', value: CLIMB, restart: true,
      options: ['BONK + DROP', 'SMASH + CLIMB', 'DRILL THROUGH', 'HAMMER', 'FLIP TAP', 'CLEAN STREAK'],
      notes: [
        'Smashing ice makes a hole and drops you back down. You jump through that hole on the next bounce. Smashing costs a whole bounce, so steering into holes is the fast route.',
        'Smashing ice lifts you straight onto that floor. No second jump. Smashing is cheap, so solid floors barely slow you down and aiming matters less.',
        'Smashing costs nothing and you fly straight through without stopping. Raise BOUNCE to punch through two or three floors in one jump.',
        'You carry a hammer. PRESS to swing at the ice right above your head, HOLD to steer. Your head alone never breaks anything, so a solid floor stops you dead unless you swing in time.',
        'You always run sideways and never stop. PRESS to turn around. No holding at all. Smashing works like BONK + DROP.',
        'Every floor you pass cleanly makes your bounce higher, up to plus 30 percent. Any bonk resets it to zero. Smashing works like BONK + DROP.'
      ] },

    { group: 'CONTROL', key: 'control', type: 'choice', value: 2,
      options: ['TAP A SIDE', 'FOLLOW FINGER', 'BOTH'],
      notes: [
        'Where your finger IS decides. Touching the left half steers left, the right half steers right. Stops the moment you lift.',
        'Your thumb drags the climber. Move it and the climber moves with it, faster than your thumb by FOLLOW GAIN. Stop and it stops - a resting thumb means climbing straight up. Nothing latches, so it can never run away on its own.',
        'A touch starts as a side hold and turns into a drag the moment it slides. So a tap or a held finger steers by side, a slide drags the climber, and once a touch has become a drag it stays one until you lift. The two never fight over one finger.'
      ] },
    { group: 'CONTROL', key: 'followGain', type: 'range', label: 'FOLLOW GAIN', min: 1, max: 6, step: 0.25, value: 3, dec: 2,
      note: 'How much faster the climber moves than your thumb. At 3, crossing the whole screen takes a third of a screen of thumb travel. FOLLOW FINGER only.' },
    { group: 'MOTION', key: 'geom', type: 'range', label: 'GEOMETRY', min: 0, max: 0, step: 1, value: 0,
      live: function (t) {
        // The three MOTION dials only mean anything against each other, and the
        // band is not a preference: below it a bounce cannot reach the next
        // floor, above it a bounce clears two and the climb stops being a climb.
        // The mechanic belongs here too: DRILL flies through floors and STREAK
        // multiplies the bounce, and neither shows up in these three numbers.
        var mech = ['BONK + DROP', 'SMASH + CLIMB', 'DRILL THROUGH',
                    'HAMMER', 'FLIP TAP', 'CLEAN STREAK'][t.mech] || '?';
        var rise = t.jump * t.jump / (2 * t.grav);
        var floors = rise / t.rowGap;
        var lo = t.rowGap, hi = 2 * t.rowGap - BH - PH;
        var warn = t.mech === DRILL ? ' DRILL THROUGH passes through several floors in one jump.'
                 : t.mech === STREAK ? ' CLEAN STREAK raises the bounce up to 1.45x as you chain.'
                 : '';
        return mech + '. One bounce rises ' + rise.toFixed(0) + 'px = ' + floors.toFixed(2) +
               ' floors. Safe band ' + lo + ' to ' + hi.toFixed(0) + 'px' +
               (rise > lo && rise < hi ? '.' : ' - OUTSIDE IT, the climb will not work.') + warn;
      } },
    { group: 'MOTION', key: 'grav', type: 'range', label: 'GRAVITY', min: 1800, max: 5400, step: 50, value: 3450 , note: 'How hard you are pulled down. Higher makes every jump shorter and the fall faster.' },
    { group: 'MOTION', key: 'jump', type: 'range', label: 'BOUNCE', min: 750, max: 1650, step: 10, value: 1017 , note: 'How hard you leave a floor. With gravity, this sets how many floors one bounce clears.' },
    // 810 lifts you 95px from the block you just broke, and standing on that
    // floor needs 69px, so the smash carries you onto it in one move.
    { group: 'MOTION', key: 'smash', type: 'range', label: 'SMASH LIFT', min: 0, max: 1200, step: 30, value: 810 , note: 'How hard you are thrown upward after breaking a block. The reward for a clean hit.' },
    // Leave SIDE SPEED alone to slow the game down; use PACE instead. Lowering
    // it costs skilled play far more than careless play, because a good player
    // needs to reach one chosen column and a careless one does not. Measured
    // with a scripted player: 450 -> skill 1.7x, 360 -> 1.6x, 320 -> 1.0x, which
    // means at 320 careful steering wins nothing over random pressing.
    { group: 'MOTION', key: 'run', type: 'range', label: 'SIDE SPEED', min: 150, max: 780, step: 10, value: 450 , note: 'Sideways speed while a side is held. Lower it and aiming gets much harder.' },
    { group: 'MOTION', key: 'rowGap', type: 'range', label: 'FLOOR GAP', min: 90, max: 186, step: 6, value: 120, restart: true , note: 'Distance between floors. Changing it changes how far a jump reaches in floors.' },
    // Turning is shown by the side-view drawing, not by tilting. LEAN is an
    // extra tilt on top of it, off by default. At 10 or so it reads as leaning
    // into the run; above 20 it looks like falling over.
    { group: 'MOTION', key: 'lean', type: 'range', label: 'LEAN (DEG)', min: 0, max: 30, step: 1, value: 0 , note: 'How far the climber tips while moving sideways. Looks only.' },

    // PACE is the one safe speed dial. It scales dt, so every distance and every
    // trajectory keeps its exact shape and only the clock changes. Slowing here
    // cannot alter the balance, unlike lowering GRAVITY, BOUNCE or SIDE SPEED.
    // At 0.55 a bounce takes 1.07 real seconds instead of 0.79, and the climber
    // crosses the screen in 2.2 seconds instead of 1.6.
    { group: 'PACE', key: 'spdFrom', type: 'range', label: 'START SPEED', min: 0.3, max: 1.2, step: 0.05, value: 0.5, dec: 2 , note: 'Game speed at the start of a run, as a multiplier. 1.00 is normal.' },
    { group: 'PACE', key: 'spdTo', type: 'range', label: 'TOP SPEED', min: 0.5, max: 2, step: 0.05, value: 0.8, dec: 2 , note: 'Game speed it climbs to. Everything speeds up together, so the difficulty is unchanged.' },
    // How tall the cloud bank between two zones is, in pixels.
    { group: 'WORLD', key: 'zoneRows', type: 'range', label: 'ZONE LENGTH', min: 8, max: 56, step: 4, value: 28, restart: true , note: 'Floors in one zone before the place changes. 28 is about a minute each.' },
    { group: 'WORLD', key: 'zoneBand', type: 'range', label: 'ZONE JOIN', min: 80, max: 480, step: 20, value: 260 , note: 'Height of the cloud band that hides the join where two zones meet.' },
    // How fast a painted background scrolls. Low is far away. The near layer
    // and the zone detail move faster than this, which is where the depth is.
    { group: 'BACKGROUND', key: 'bgPar', type: 'range', label: 'BG PARALLAX', min: 0, max: 40, step: 1, value: 8 , note: 'How fast the background scrolls against the floors. Everything behind follows this one number.' },
    { group: 'BACKGROUND', key: 'mirror', type: 'toggle', label: 'MIRROR TILE', value: true , note: 'flips every second copy of the background upside down, so a picture that does not tile still has no visible join.' },
    { group: 'BACKGROUND', key: 'nearShade', type: 'range', label: 'NEAR SHADE', min: 0, max: 80, step: 5, value: 45 , note: 'How much darker the near background layer is drawn, so it reads as closer than the far one.' },
    { group: 'BACKGROUND', key: 'bgTint', type: 'range', label: 'BG TINT', min: 0, max: 70, step: 5, value: 40 , note: 'One wash over the whole backdrop, so it sits behind the play area without flattening its depth.' },
    { group: 'BACKGROUND', key: 'blockShadow', type: 'range', label: 'BLOCK SHADOW', min: 0, max: 50, step: 5, value: 25 , note: 'Shadow under every floor. This is what makes blocks read as in front of the background.' },
    { group: 'PACE', key: 'spdSecs', type: 'range', label: 'SECS TO TOP', min: 5, max: 180, step: 5, value: 90 , note: 'Seconds taken to go from the start speed to the end speed.' },

    // Hitstop is the single biggest part of how a break feels. 0 turns it off.
    // With SMASH + CLIMB you break a block roughly once a second, so anything
    // much above 80 starts to read as the game stuttering rather than hitting.
    { group: 'IMPACT', key: 'haptics', type: 'toggle', label: 'HAPTICS', value: true , note: 'vibration entirely.' },
    { group: 'IMPACT', key: 'hapticMs', type: 'range', label: 'HAPTIC MS', min: 1, max: 40, step: 1, value: 1 , note: 'Length of the shortest pulse. Everything else is a multiple of it. 1 is the floor the phone allows.' },
    { group: 'IMPACT', key: 'buzzOn', type: 'choice', value: 0,
      options: ['EVERY HIT', 'BREAKS', 'BIG ONLY'],
      notes: [
        'Chip, break, and the FIRST hit on something you cannot break. No material needs more than two hits, so a block gives at most one chip before it goes - the chip is progress, not noise. A dead end answers once and then stays quiet however long you hammer it.',
        'Only a block actually breaking. Chips and dead ends stay silent, so the buzz means one thing: that worked. 18% of blocks take two hits, and with this you feel the second one only.',
        'Only a block that took more than one hit. The phone stays quiet through ordinary climbing and speaks when something was earned. Use this when even 1ms is more than you want on every floor.'
      ] },
    { group: 'IMPACT', key: 'hitstop', type: 'range', label: 'HITSTOP (MS)', min: 0, max: 140, step: 5, value: 70 , note: 'How long the game freezes on a hit. This is what gives a break its weight.' },
    { group: 'IMPACT', key: 'shakeHit', type: 'range', label: 'SHAKE ON BREAK', min: 0, max: 8, step: 0.25, value: 1.25, dec: 2 , note: 'Screen shake when a block breaks. Every other block shake scales from this.' },
    { group: 'IMPACT', key: 'sparks', type: 'range', label: 'SPARKLES', min: 0, max: 24, step: 2, value: 12 , note: 'Sparkles thrown out by a break. Looks only.' },

    // A combo point per hit the block cost you, doubled again for every extra
    // block taken in the same swing. The window is how long you have to keep it.
    { group: 'IMPACT', key: 'comboWin', type: 'range', label: 'COMBO WINDOW', min: 0.5, max: 5, step: 0.25, value: 2.25, dec: 2 , note: 'Seconds you have to hit the next block before the combo ends.' },
    { group: 'IMPACT', key: 'comboStep', type: 'range', label: 'POINTS PER x', min: 4, max: 40, step: 2, value: 8 , note: 'Points needed for each step of the combo multiplier. Lower means it climbs faster.' },

    { group: 'THE KIT', key: 'condor', type: 'toggle', label: 'CONDOR', value: false,
      note: 'the fourth piece: a full kit summons a condor that flies you up through everything. Off, the kit stops at three pieces and a full kit pays +30 instead.' },
    { group: 'THE KIT', key: 'kitCost', type: 'range', label: 'VEG PER GEAR', min: 1, max: 8, step: 1, value: 2 , note: 'Veggies needed to buy the next piece of gear.' },
    { group: 'THE KIT', key: 'vegRate', type: 'range', label: 'VEG ON FLOORS', min: 5, max: 100, step: 5, value: 65, restart: true , note: 'Chance in a hundred that a floor carries a veggie.' },
    { group: 'THE KIT', key: 'vegFar', type: 'range', label: 'VEG OFF PATH', min: 0, max: 100, step: 5, value: 60, restart: true , note: 'Chance the veggie is placed away from the easy path, so it costs a detour.' },
    { group: 'THE KIT', key: 'flySec', type: 'range', label: 'CONDOR TIME', min: 1, max: 8, step: 0.5, value: 4, dec: 1 , note: 'Seconds the condor carries you.' },
    { group: 'THE KIT', key: 'flySpd', type: 'range', label: 'CONDOR SPEED', min: 240, max: 960, step: 30, value: 510 , note: 'How fast the condor climbs while carrying you.' },

    // The snow rises at snowBase + t * snowRamp and tops out at +186. A perfect
    // climb is one floor per bounce, which is 204 px per game second, so the
    // snow becomes faster than anyone can climb at t = (204 - base) / ramp. At
    // 45 and 2.1 that is 76 seconds, where it used to be 46.
    { group: 'PRESSURE', key: 'snowBase', type: 'range', label: 'SNOW START', min: 0, max: 270, step: 3, value: 45 , note: 'Starting speed of the avalanche.' },
    { group: 'PRESSURE', key: 'snowRamp', type: 'range', label: 'SNOW RAMP', min: 0, max: 9, step: 0.15, value: 2.1, dec: 1 , note: 'How much faster the avalanche gets each second.' },
    // MAX LEAD is how far the snow is allowed to fall behind. At 1380 it could
    // never drop more than 11.5 floors back, so climbing well earned no safety
    // and the snow was always just under you. 3000 is 25 floors, far enough
    // that a good climb genuinely leaves it behind.
    { group: 'PRESSURE', key: 'snowLead', type: 'range', label: 'MAX LEAD', min: 600, max: 4200, step: 60, value: 3000 , note: 'Closest the avalanche is ever allowed to sit below you. Your safety margin.' },
    // How much of a floor is something other than plain ice. It ramps in over
    // the first four zones, so zone 1 is always plain ice while you learn.
    { group: 'PRESSURE', key: 'matRate', type: 'range', label: 'MATERIAL MIX', min: 0, max: 100, step: 5, value: 45, restart: true , note: 'How much of the mix is harder materials rather than plain ice.' },
    { group: 'PRESSURE', key: 'topiSpd', type: 'range', label: 'TOPI SPEED', min: 0, max: 210, step: 6, value: 72 , note: 'Walking speed of the creatures on the floors.' },
    { group: 'PRESSURE', key: 'hawkGap', type: 'range', label: 'HAWK GAP', min: 1, max: 9, step: 0.5, value: 5, dec: 1 , note: 'Seconds between birds. It shortens as your score rises.' },

    { group: 'SHOW', key: 'kit', type: 'toggle', label: 'THE KIT', value: true , note: 'the gear chain. Off means no veggies and no upgrades.' },
    { group: 'SHOW', key: 'hawks', type: 'toggle', label: 'HAWKS', value: true , note: 'the birds that cross the screen and knock you down.' },
    { group: 'SHOW', key: 'topi', type: 'toggle', label: 'TOPI', value: true , note: 'the creatures walking along the floors.' },
    { group: 'SHOW', key: 'snow', type: 'toggle', label: 'AVALANCHE', value: true , note: 'the rising avalanche. Off means nothing can kill you.' },
    { group: 'SHOW', key: 'rock', type: 'toggle', label: 'ROCK', value: true , note: 'unbreakable blocks in the mix.' },
    { group: 'SHOW', key: 'mats', type: 'toggle', label: 'MATERIALS', value: true , note: 'the material types. Off makes every block plain ice.' },
    { group: 'SHOW', key: 'scenery', type: 'toggle', label: 'SCENERY', value: true , note: 'everything drawn behind the floors.' },
    // 0 shows the scenery at full strength, 90 leaves almost only the sky.
    { group: 'BACKGROUND', key: 'bgDim', type: 'range', label: 'BACKGROUND DIM', min: 0, max: 90, step: 5, value: 60 , note: 'Haze on the FAR background only. Distance, not a general dimmer.' },
    // Four looks exist for every zone. This switches all of them at once so
    // they can be compared in play rather than only on the zones page.
    { group: 'BACKGROUND', key: 'look', type: 'range', label: 'BACKDROP', min: 0, max: 3, step: 1, value: 0 , note: 'Which of the four drawn backdrops a zone uses. Ignored where painted art exists.' },
    { group: 'BACKGROUND', key: 'detail', type: 'toggle', label: 'ZONE DETAIL', value: true , note: 'the moving layer in front of the background - snow, embers, fish.' },
    // Off falls back to the drawn backdrops even where a PNG exists.
    { group: 'BACKGROUND', key: 'painted', type: 'toggle', label: 'PAINTED BG', value: true , note: 'painted PNG backgrounds. Off goes back to the drawn ones.' },
    { group: 'SHOW', key: 'joystick', type: 'toggle', label: 'JOYSTICK', value: true,
      note: 'a faint pixel joystick under your thumb while you drag, so one-finger steering is visible. Never shown for TAP A SIDE.' },
    { group: 'SHOW', key: 'hires', type: 'toggle', label: 'RENDER 2X', value: true,
      note: 'draws the screen at twice the pixel count so edges stay crisp on a phone. Turn off if a run ever stutters.' },
    { group: 'SHOW', key: 'floorNo', type: 'toggle', label: 'FLOOR NO.', value: true , note: 'the floor number in the corner.' },
    { group: 'SHOW', key: 'path', type: 'toggle', label: 'SHOW PATH', value: false,
      note: 'a marker on every gap you could climb through. A debugging aid.' }
  ], function (key, t) {
    if (key === 'mech') t.smash = SMASH_DEFAULT[t.mech];
  });

  var S = {};

  function rowY(n) { return -n * T.rowGap; }
  function zoneOf(n) { return Math.floor(n / ZONE_ROWS); }

  function bestKit() {
    try { return parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0; } catch (e) { return 0; }
  }
  function noteBestKit(level) {
    if (level <= bestKit()) return;
    try { localStorage.setItem(BEST_KEY, String(level)); } catch (e) { /* ignore */ }
  }

  /* ---- floor generation ---------------------------------------------- */

  function rockChance(z) {
    return T.rock ? placeOf(z).rock * Math.min(1, (z + 1) / 2) : 0;
  }

  function driftFrom(lastGap, gapW) {
    var d = Math.floor(Math.random() * 5) - 2;
    return Math.max(0, Math.min(COLS - gapW, lastGap + d));
  }

  function gappedRow(z, b, lastGap) {
    var gapW = (z <= 1 && Math.random() < 0.5) ? 2 : 1;
    var gs = driftFrom(lastGap, gapW);
    var rc = rockChance(z);
    for (var i = 0; i < COLS; i++) {
      if (i >= gs && i < gs + gapW) b[i] = EMPTY;
      else b[i] = Math.random() < rc ? ROCK : ICE;
    }
    return gs;
  }

  function solidRow(b) { for (var i = 0; i < COLS; i++) b[i] = ICE; }

  function mixedRow(z, b, lastGap) {
    solidRow(b);
    var want = 2 + Math.floor(Math.random() * 3);
    var placed = 0, guard = 0, i;
    while (placed < want && guard++ < 20) {
      var run = 1 + Math.floor(Math.random() * 2);
      var at = Math.floor(Math.random() * (COLS - run + 1));
      for (i = at; i < at + run && placed < want; i++) {
        if (b[i] === ICE) { b[i] = ROCK; placed++; }
      }
    }
    var keep = Math.max(0, Math.min(COLS - 1, lastGap));
    b[keep] = ICE;
    if (keep + 1 < COLS) b[keep + 1] = ICE; else b[keep - 1] = ICE;
    return keep;
  }

  function zoneLineRow(b, lastGap) {
    var gs = driftFrom(lastGap, 3);
    for (var i = 0; i < COLS; i++) b[i] = (i >= gs && i < gs + 3) ? EMPTY : ICE;
    return gs;
  }

  function pickKind(n, z) {
    if (n === 0) return 'ground';
    if (n % ZONE_ROWS === 0) return 'zoneline';
    var r = Math.random();
    if (z <= 0) return 'gapped';
    if (z === 1) return r < 0.80 ? 'gapped' : 'solid';
    if (z === 2) return r < 0.70 ? 'gapped' : (r < 0.95 ? 'solid' : 'mixed');
    if (z === 3) return r < 0.60 ? 'gapped' : (r < 0.80 ? 'solid' : 'mixed');
    return r < 0.45 ? 'gapped' : (r < 0.70 ? 'solid' : 'mixed');
  }

  function placeVeg(b, path) {
    var near = [], far = [];
    for (var c = 0; c < COLS; c++) {
      if (!isSolid(b[c])) continue;
      (Math.abs(c - path) >= 2 ? far : near).push(c);
    }
    var pool = (Math.random() * 100 < T.vegFar && far.length) ? far : near;
    if (!pool.length) pool = far.length ? far : near;
    if (!pool.length) return -1;
    return pool[Math.floor(Math.random() * pool.length)];
  }

  // Materials replace plain ICE only, and never within one column of the path,
  // so whatever else appears there is always an easy route straight up. Iron and
  // powder are capped per row for the same reason: a floor must never be a wall.
  // Blue ice is in from the very first floor. A whole zone of plain ice before
  // anything appears meant a normal run ended before you met one material.

  /* ---- the six places -------------------------------------------------- */
  /* A zone used to be a colour swap. Now it is somewhere: its own sky, its own
     stone, its own scenery behind the blocks, and its own mix of materials. The
     place is what explains the materials - iron and crates belong to the mine,
     blue ice and hollow ice belong to the glacier. */

  // Draw a repeating band of scenery, scrolling slower than the blocks so the
  // mountain reads as deep. par is how much slower: 0.3 is far, 0.55 is close.
  // Set while a painted zone draws its detail: PAINTED_PAR is the far image's
  // speed, DETAIL_SCALE brings the hand-written band speeds down with it. Both
  // are -1 / 1 the rest of the time, so the drawn backdrops are untouched.
  var PAINTED_PAR = -1, DETAIL_SCALE = 1;
  var REF_PAR = 0.16;                 // the speed the det* bands were written against

  function band(par, period, fn) {
    // Over painted art a detail band moving at the image's own speed adds no
    // depth. It only draws a second, competing scene on top of the first. Keep
    // the bands that are clearly faster - the snow, the embers, the fish - and
    // drop the slow scenery the image is already providing.
    if (PAINTED_PAR >= 0) {
      par *= DETAIL_SCALE;
      if (par < PAINTED_PAR + 0.06) return;
    }
    var off = S.cam * par;
    var k0 = Math.floor((off - period) / period);
    for (var k = k0; k < k0 + 5; k++) fn(k, k * period - off);
  }

  // JS gives -1 for (-1 % 8), so every palette lookup keyed on a zone has to wrap
  // the same way placeOf does. An undefined palette entry is a crash, not a
  // wrong colour.
  function zidx(z, len) { return ((z % len) + len) % len; }

  // Blend two '#rrggbb' strings. Cached, because the sky asks for the same pair
  // every frame for the whole crossfade.
  var mixCache = {};
  function mixHex(a, b, t) {
    var key = a + b + (t * 64 | 0);
    var hit = mixCache[key];
    if (hit) return hit;
    var out = '#';
    for (var i = 1; i < 7; i += 2) {
      var x = parseInt(a.substr(i, 2), 16), y = parseInt(b.substr(i, 2), 16);
      var v = Math.round(x + (y - x) * t);
      out += (v < 16 ? '0' : '') + v.toString(16);
    }
    mixCache[key] = out;
    return out;
  }

  /* ---- eight backdrops, one recipe -------------------------------------
     Chosen from the options page: the dunes for Egypt, and both the sunlit
     water and the abyss for the sea. What all three have in common is the
     direction for every zone here:

       a banded vertical gradient for depth,
       three or four big soft shapes,
       a handful of small glowing accents,
       one large light source,
       and no hard structure at all.

     No columns, no pipes, no chips. Detail at that scale turns to noise behind
     a game, and every one of those shapes was something the eye had to sort out
     from the floors. C is { sky1, sky2, mass, glow, ink }. */

  var GRAD_BAND = 24;

  function grad(g, c1, c2) {
    var n = Math.ceil(H / GRAD_BAND), i;
    for (i = 0; i < n; i++) {
      g.rect(0, i * GRAD_BAND, W, GRAD_BAND + 1, mixHex(c1, c2, i / (n - 1)));
    }
  }

  // Soft rolling ridges, the shape the dunes are built from. Curved and low
  // contrast on purpose: a straight hard band here would read as a floor.
  function ridges(g, col, baseY, amp, freq, phase, par) {
    var off = S.cam * par, x, y;
    for (x = 0; x < W; x += 3) {
      y = baseY + off + Math.sin((x + phase) * freq) * amp + Math.sin(x * freq * 0.37) * amp * 0.45;
      g.rect(x, y, 3, H - y, col);
    }
  }

  function disc(g, cx, cy, r, col) {
    for (var dy = -r; dy <= r; dy++) {
      var w = Math.round(Math.sqrt(r * r - dy * dy));
      if (w > 0) g.rect(cx - w, cy + dy, w * 2, 1, col);
    }
  }

  // sparse drifting motes: embers, bubbles, marine snow, stars
  function motes(g, col, n, size, par, period) {
    band(par, period, function (k, y) {
      for (var i = 0; i < n; i++) {
        g.rect((Arcade.hash(k * 31 + i) * W) | 0,
               y + ((Arcade.hash(k * 37 + i) * period) | 0),
               size, size, col);
      }
    });
  }

  /* ---- per-zone detail --------------------------------------------------
     The composition gives a zone its shape; this gives it its subject. Drawn
     after the composition and before the dim, so it is held back with the rest.
     Kept to verticals, diagonals and discs: nothing here may look like a ledge. */

  function detIce(g, C) {
    band(0.44, 300, function (k, y) {
      for (var i = 0; i < 16; i++) {
        g.rect((Arcade.hash(k * 61 + i) * W) | 0, y + ((Arcade.hash(k * 67 + i) * 300) | 0),
               i % 4 ? 3 : 5, i % 4 ? 3 : 5, C.glow);
      }
    });
    band(0.16, 420, function (k, y) {
      for (var x = 0; x < W; x += 4) {
        var h = 70 + Math.sin((x + k * 130) * 0.009) * 46 + Math.sin(x * 0.021) * 20;
        g.rect(x, y + 300 - h, 4, h, mixHex(C.mass, C.sky1, 0.45));
      }
    });
  }

  function detWood(g, C) {
    band(0.62, 360, function (k, y) {
      g.rect(k % 2 ? 4 : W - 40, y - 20, 36, 400, C.ink);
      g.rect(k % 2 ? 4 : W - 40, y - 20, 12, 400, mixHex(C.ink, C.mass, 0.4));
    });
    band(0.40, 280, function (k, y) {
      for (var i = 0; i < 9; i++) {
        g.rect((Arcade.hash(k * 71 + i) * W) | 0, y + ((Arcade.hash(k * 73 + i) * 280) | 0),
               7, 4, mixHex(C.mass, C.glow, 0.5));
      }
    });
  }

  function detMedieval(g, C) {
    band(0.24, 480, function (k, y) {
      for (var i = 0; i < 4; i++) {
        var x = i * 140 + (k % 2 ? 70 : 12), w2 = 54, h2 = 170 + (Arcade.hash(k * 151 + i) * 90 | 0);
        g.rect(x, y + 330 - h2, w2, h2, C.mass);
        g.rect(x, y + 330 - h2, 16, h2, mixHex(C.mass, C.glow, 0.22));
        for (var t = -w2 / 2; t <= w2 / 2; t += 2) {
          var rh = 46 * (1 - Math.abs(t) / (w2 / 2));
          g.rect(x + w2 / 2 + t, y + 330 - h2 - rh, 2, rh, C.ink);
        }
        for (var j = 0; j < 3; j++) g.rect(x + 20, y + 360 - h2 + j * 52, 14, 20, C.glow);
      }
    });
    band(0.50, 300, function (k, y) {
      for (var i = 0; i < 5; i++) {
        var bx = (Arcade.hash(k * 157 + i) * W) | 0, by = y + ((Arcade.hash(k * 163 + i) * 300) | 0);
        g.rect(bx, by + 3, 7, 3, C.ink); g.rect(bx + 7, by, 7, 3, C.ink);
      }
    });
  }

  function detDunes(g, C) {
    band(0.18, 520, function (k, y) {
      for (var i = 0; i < 3; i++) {
        var cx = i * 190 + (k % 2 ? 90 : 20), hw = 66 + i * 14, hh = 78 + i * 16;
        for (var x = -hw; x <= hw; x += 3) {
          var h = hh * (1 - Math.abs(x) / hw);
          if (h > 0) g.rect(cx + x, y + 340 - h, 3, h, x < 0 ? mixHex(C.mass, C.glow, 0.3) : C.mass);
        }
      }
    });
    band(0.50, 300, function (k, y) {
      for (var i = 0; i < 12; i++) {
        g.rect((Arcade.hash(k * 79 + i) * W) | 0, y + ((Arcade.hash(k * 83 + i) * 300) | 0),
               22 + (Arcade.hash(k * 89 + i) * 30 | 0), 3, mixHex(C.mass, C.glow, 0.35));
      }
    });
  }

  function detForge(g, C) {
    band(0.34, 340, function (k, y) {
      for (var i = 0; i < 3; i++) {
        var x = i * 190 + (k % 2 ? 80 : 20);
        for (var j = 0; j < 300; j += 22) {
          disc(g, x + Math.sin((j + k * 50) * 0.02) * 26, y + 300 - j, 16 + j * 0.06,
               mixHex(C.ink, C.sky1, 0.35));
        }
      }
    });
    band(0.56, 260, function (k, y) {
      for (var i = 0; i < 14; i++) {
        g.rect((Arcade.hash(k * 91 + i) * W) | 0, y + ((Arcade.hash(k * 97 + i) * 260) | 0), 4, 8, C.glow);
      }
    });
  }

  function detShallows(g, C) {
    band(0.46, 320, function (k, y) {
      for (var i = 0; i < 7; i++) {
        var fx = (Arcade.hash(k * 101 + i) * (W - 30)) | 0;
        var fy = y + ((Arcade.hash(k * 103 + i) * 320) | 0);
        g.rect(fx, fy, 20, 8, C.glow); g.rect(fx - 7, fy + 2, 7, 5, C.glow);
      }
    });
    band(0.30, 360, function (k, y) {
      for (var i = 0; i < 6; i++) {
        var x = i * 92 + (Arcade.hash(k * 107 + i) * 30 | 0);
        for (var j = 0; j < 190; j += 12) {
          g.rect(x + Math.sin((j + i * 40) * 0.03) * 12, y + 330 - j, 10, 12, C.mass);
        }
      }
    });
  }

  function detAbyss(g, C) {
    band(0.40, 460, function (k, y) {
      for (var i = 0; i < 2; i++) {
        var jx = 80 + ((Arcade.hash(k * 109 + i) * (W - 160)) | 0), jy = y + 120 + i * 230;
        disc(g, jx, jy, 34, mixHex(C.glow, C.sky2, 0.62));
        for (var a = -20; a <= 20; a++) {
          var hh = Math.round(Math.sqrt(400 - a * a));
          g.rect(jx + a, jy - hh, 1, hh, C.glow);
        }
        for (var t = 0; t < 5; t++) {
          for (var j = 0; j < 80; j += 7) {
            g.rect(jx - 16 + t * 8 + Math.sin((j + t * 18) * 0.06) * 6, jy + j, 3, 7,
                   mixHex(C.glow, C.sky2, 0.4));
          }
        }
      }
    });
  }

  function detWorks(g, C) {
    band(0.34, 380, function (k, y) {
      for (var i = 0; i < 3; i++) {
        var x = i * 190 + (k % 2 ? 100 : 30);
        for (var j = 0; j < 260; j += 26) {
          disc(g, x + Math.sin((j + k * 40) * 0.018) * 30, y + 260 - j, 18 + j * 0.07,
               mixHex(C.ink, C.sky1, 0.4));
        }
      }
    });
    band(0.52, 300, function (k, y) {
      for (var i = 0; i < 7; i++) {
        if ((k + i) % 3) continue;
        disc(g, 40 + i * 78, y + 60 + (i % 4) * 66, 6, C.glow);
      }
    });
  }

  function detTech(g, C) {
    band(0.30, 300, function (k, y) {
      for (var i = 0; i < 9; i++) {
        var x = i * 62 + (Arcade.hash(k * 113 + i) * 20 | 0);
        for (var j = 0; j < 300; j += 26) {
          g.rect(x, y + ((j + k * 70) % 300), 5, 14, mixHex(C.glow, C.sky2, (j / 300) * 0.7));
        }
      }
    });
    band(0.50, 340, function (k, y) {
      for (var i = 0; i < 5; i++) {
        var nx = (Arcade.hash(k * 127 + i) * (W - 40)) | 0;
        var ny = y + ((Arcade.hash(k * 131 + i) * 340) | 0);
        ringOf(g, nx, ny, 13, 4, C.glow);
        disc(g, nx, ny, 4, C.glow);
      }
    });
  }

  function detFuture(g, C) {
    band(0.28, 420, function (k, y) {
      for (var i = 0; i < 6; i++) {
        var x = i * 92 + (Arcade.hash(k * 167 + i) * 26 | 0);
        var h2 = 190 + (Arcade.hash(k * 173 + i) * 180 | 0);
        g.rect(x, y + 400 - h2, 58, h2, C.mass);
        g.rect(x + 4, y + 400 - h2, 5, h2, C.glow);
        for (var j = 0; j < 5; j++) {
          g.rect(x + 16, y + 430 - h2 + j * 62, 26, 9, j % 2 ? C.glow : mixHex(C.glow, C.sky1, 0.45));
        }
      }
    });
    band(0.56, 260, function (k, y) {
      for (var i = 0; i < 8; i++) {
        g.rect((Arcade.hash(k * 179 + i) * W) | 0, y + ((Arcade.hash(k * 181 + i) * 260) | 0), 26, 4, C.glow);
      }
    });
  }

  function detMoon(g, C) {
    band(0.16, 560, function (k, y) {
      var ex = k % 2 ? 120 : 400, ey = y + 170;
      disc(g, ex, ey, 74, mixHex(C.glow, C.sky1, 0.45));
      disc(g, ex, ey, 66, C.glow);
      disc(g, ex - 20, ey - 14, 26, mixHex(C.glow, C.mass, 0.55));
      disc(g, ex + 18, ey + 22, 20, mixHex(C.glow, C.mass, 0.55));
    });
    band(0.38, 320, function (k, y) {
      for (var i = 0; i < 6; i++) {
        var cx = (Arcade.hash(k * 137 + i) * W) | 0, cy = y + ((Arcade.hash(k * 139 + i) * 320) | 0);
        var r = 16 + (Arcade.hash(k * 149 + i) * 26 | 0);
        ringOf(g, cx, cy, r, 5, mixHex(C.mass, C.glow, 0.3));
        disc(g, cx, cy, r - 6, mixHex(C.mass, C.ink, 0.5));
      }
    });
  }

  function detOrbit(g, C) {
    band(0.44, 520, function (k, y) {
      var sx = 70 + ((Arcade.hash(k * 191) * (W - 140)) | 0), sy = y + 200;
      g.rect(sx, sy, 30, 20, C.mass);
      g.rect(sx - 30, sy + 5, 26, 10, mixHex(C.mass, C.glow, 0.4));
      g.rect(sx + 30, sy + 5, 26, 10, mixHex(C.mass, C.glow, 0.4));
      disc(g, sx + 15, sy + 10, 4, C.glow);
    });
    band(0.20, 600, function (k, y) {
      var stx = (Arcade.hash(k * 193) * W) | 0, sty = y + 120;
      for (var j = 0; j < 9; j++) g.rect(stx + j * 9, sty + j * 5, 8 - j * 0.6, 3, C.glow);
    });
  }

  function ringOf(g, cx, cy, r, th, col) {
    var ri = Math.max(0, r - th), dy, wo, wi;
    for (dy = -r; dy <= r; dy++) {
      wo = Math.sqrt(Math.max(0, r * r - dy * dy));
      wi = Math.abs(dy) < ri ? Math.sqrt(ri * ri - dy * dy) : 0;
      if (wo - wi < 0.5) continue;
      g.rect(cx - wo, cy + dy, wo - wi, 1, col);
      g.rect(cx + wi, cy + dy, wo - wi, 1, col);
    }
  }

  /* ---- eight compositions ----------------------------------------------
     Every zone is a palette plus one of these, so a zone can be re-shot in a
     different composition without redrawing anything. o carries the tuning. */

  function compRidges(g, C, o) {
    grad(g, C.sky1, C.sky2);
    if (o.sr) disc(g, o.sx, o.sy, o.sr, C.glow);
    ridges(g, C.mass, o.top || 520, 50, 0.0068, 0, 0.18);
    ridges(g, mixHex(C.mass, C.ink, 0.45), (o.top || 520) + 170, 42, 0.0095, 150, 0.27);
    ridges(g, C.ink, (o.top || 520) + 330, 32, 0.0130, 330, 0.38);
    if (o.motes) motes(g, C.glow, o.motes, 4, 0.5, 300);
  }

  function compOrb(g, C, o) {
    grad(g, C.sky1, C.sky2);
    disc(g, o.sx, o.sy, o.sr * 1.5, mixHex(C.sky1, C.glow, 0.18));
    disc(g, o.sx, o.sy, o.sr, mixHex(C.glow, C.sky1, 0.3));
    disc(g, o.sx, o.sy, o.sr * 0.66, C.glow);
    if (o.ring) ringOf(g, o.sx, o.sy, o.sr * 1.7, 5, mixHex(C.glow, C.sky2, 0.45));
    motes(g, C.glow, o.motes || 5, 4, 0.3, 380);
  }

  function compShafts(g, C, o) {
    grad(g, C.sky1, C.sky2);
    band(0.18, 360, function (k, y) {
      for (var i = 0; i < (o.n || 6); i++) {
        var x = i * (540 / (o.n || 6)) - 40;
        for (var j = 0; j < 360; j += 6) g.rect(x + j * (o.lean || 0.42), y + j, o.w || 44, 6, C.mass);
      }
    });
    motes(g, C.glow, o.motes || 8, 5, 0.42, 300);
  }

  function compDrift(g, C, o) {
    grad(g, C.sky1, C.sky2);
    if (o.sr) disc(g, o.sx, o.sy, o.sr, C.glow);
    motes(g, C.mass, o.far || 24, 3, 0.14, 460);
    motes(g, mixHex(C.mass, C.glow, 0.5), o.mid || 14, 4, 0.30, 380);
    motes(g, C.glow, o.near || 8, 6, 0.52, 300);
  }

  function compCanopy(g, C, o) {
    grad(g, C.sky1, C.sky2);
    if (o.sr) disc(g, o.sx, o.sy, o.sr, C.glow);
    band(0.22, 340, function (k, y) {
      for (var i = 0; i < 8; i++) {
        disc(g, i * 74 + (Arcade.hash(k * 7 + i) * 36 | 0),
             y + 110 + (i % 3) * 40, (o.r1 || 46) + (Arcade.hash(k * 11 + i) * 26 | 0), C.mass);
      }
    });
    band(0.44, 380, function (k, y) {
      for (var i = 0; i < 5; i++) {
        disc(g, i * 118 + (k % 2 ? 58 : 0), y + 250 + (i % 2) * 54,
             (o.r2 || 60) + (Arcade.hash(k * 13 + i) * 30 | 0), C.ink);
      }
    });
    if (o.motes) motes(g, C.glow, o.motes, 5, 0.5, 320);
  }

  function compMass(g, C, o) {
    grad(g, C.sky1, C.sky2);
    if (o.sr) disc(g, o.sx, o.sy, o.sr, C.glow);
    band(0.24, 400, function (k, y) {
      for (var i = 0; i < 4; i++) {
        var x = i * 148 + (k % 2 ? 70 : 10);
        var w2 = 96 + (Arcade.hash(k * 7 + i) * 40 | 0);
        var h2 = 150 + (Arcade.hash(k * 11 + i) * 110 | 0);
        g.rect(x, y + 320 - h2, w2, h2, C.mass);
        disc(g, x + w2 / 2, y + 320 - h2, w2 / 2, C.mass);
      }
    });
    band(0.46, 440, function (k, y) {
      for (var i = 0; i < 3; i++) {
        var x = i * 196 + (k % 2 ? 100 : 0);
        g.rect(x, y + 300, 150, 200, C.ink);
        disc(g, x + 75, y + 300, 75, C.ink);
      }
    });
    if (o.motes) motes(g, C.glow, o.motes, 5, 0.5, 300);
  }

  function compStrata(g, C, o) {
    grad(g, C.sky1, C.sky2);
    if (o.sr) disc(g, o.sx, o.sy, o.sr, C.glow);
    band(0.20, 420, function (k, y) {
      for (var i = 0; i < 5; i++) {
        var h2 = 34 + (Arcade.hash(k * 17 + i) * 46 | 0);
        var x = (Arcade.hash(k * 19 + i) * 200) | 0;
        g.rect(x, y + i * 84, W - x - (Arcade.hash(k * 23 + i) * 140 | 0), h2,
               i % 2 ? C.mass : mixHex(C.mass, C.ink, 0.5));
      }
    });
    if (o.motes) motes(g, C.glow, o.motes, 4, 0.44, 320);
  }

  function compArc(g, C, o) {
    grad(g, C.sky1, C.sky2);
    band(0.22, 560, function (k, y) {
      ringOf(g, k % 2 ? 120 : 420, y + 300, 300, 46, C.mass);
      ringOf(g, k % 2 ? 120 : 420, y + 300, 190, 26, mixHex(C.mass, C.ink, 0.4));
    });
    if (o.sr) disc(g, o.sx, o.sy, o.sr, C.glow);
    motes(g, C.glow, o.motes || 8, 5, 0.46, 320);
  }

  // Twelve zones, four looks each, and a detail layer that carries the subject.
  // The first look is the default; BACKDROP in the drawer switches all of them.

               { n: 'THE RING', f: compArc, o: { sx: 120, sy: 160, sr: 44, motes: 10 } },
               { n: 'NEBULA', f: compStrata, o: { sx: 400, sy: 180, sr: 60, motes: 12 } } ] }
  ];

  /* ---- painted backgrounds ---------------------------------------------
     A zone will use zones/<slug>.png if that file exists, and fall back to the
     procedural backdrop if it does not. One image per zone, not two: there is
     no night mode any more. The image is tiled top to
     bottom at a parallax factor, so it has to be seamless vertically - the
     bottom edge must continue into the top edge.

     PNG over procedural code for two reasons: an image model can make something
     no amount of rects will, and a PNG ports to Unity later while a page of
     canvas calls does not. */

  var ZIMG = {}, ZSEAM = {};

  function slug(name) { return name.toLowerCase().replace(/[^a-z0-9]+/g, '-'); }

  // suffix '' is the far scene, '-near' an optional transparent layer in front.
  function zoneImage(z, suffix) {
    var key = slug(placeOf(z).name) + (suffix || '');
    if (!(key in ZIMG)) {
      ZIMG[key] = null;                       // null while loading, and if missing
      var im = new Image();
      im.onload = function () {
        ZIMG[key] = im;
        // A seamless image has the same colour at its top and bottom edge, so
        // one sample of the top row is the colour the zone meets its neighbour
        // with. The band between zones is built from these, which means it fits
        // whatever art turns up without anyone entering a colour by hand.
        try {
          if (suffix) return;          // only the far scene sets the seam colour
          var c = document.createElement('canvas');
          c.width = im.width; c.height = 1;
          var cx = c.getContext('2d');
          cx.drawImage(im, 0, 0, im.width, 1, 0, 0, im.width, 1);
          var d = cx.getImageData(0, 0, im.width, 1).data, r = 0, gg = 0, b = 0, n = 0;
          for (var i = 0; i < d.length; i += 4) { r += d[i]; gg += d[i + 1]; b += d[i + 2]; n++; }
          ZSEAM[key] = '#' + [r / n, gg / n, b / n].map(function (v) {
            var h = Math.round(v).toString(16); return h.length < 2 ? '0' + h : h;
          }).join('');
        } catch (e) { /* a canvas we cannot read is not worth failing over */ }
      };
      im.src = 'zones/' + key + '.png';
    }
    return ZIMG[key];
  }

  // The colour a zone meets its neighbour with: sampled from its image if one
  // has loaded, otherwise its own sky.
  function seamColour(z, P) {
    return ZSEAM[slug(placeOf(z).name)] || P.zoneBg[zidx(z, P.zoneBg.length)];
  }

  // A bank of cloud sitting on the join. Built from the two zones' own seam
  // colours, so it fits any pair of images without anyone choosing a colour.
  // It is the one place a full-width horizontal mass is allowed, because there
  // is a real floor here - the gold zone line - so the eye is not being lied to.
  function drawSeam(g, ctx, P, y, z) {
    var above = seamColour(z, P);              // the zone you are climbing into
    var below = seamColour(z - 1, P);          // the one you are leaving
    var h = T.zoneBand, top = y - h / 2, i, t, cy;

    // a soft gradient through the join, so neither image ends on a hard edge
    var steps = 16;
    for (i = 0; i < steps; i++) {
      t = i / (steps - 1);
      ctx.globalAlpha = 1 - Math.abs(t - 0.5) * 2 * 0.15 - 0.06;
      g.rect(0, top + i * (h / steps), W, h / steps + 1, mixHex(above, below, t));
    }
    ctx.globalAlpha = 1;

    // cloud, drawn from both colours so it reads as belonging to both sides
    for (i = 0; i < 14; i++) {
      var r = 26 + (Arcade.hash(z * 31 + i) * 46 | 0);
      var cx = (Arcade.hash(z * 37 + i) * (W + 120)) - 60;
      t = Arcade.hash(z * 41 + i);
      cy = top + h * (0.22 + t * 0.56);
      disc(g, cx, cy, r, mixHex(above, below, (cy - top) / h));
    }
    for (i = 0; i < 7; i++) {                  // brighter tops catching the light
      var r2 = 16 + (Arcade.hash(z * 43 + i) * 26 | 0);
      var cx2 = (Arcade.hash(z * 47 + i) * (W + 80)) - 40;
      var cy2 = top + h * (0.20 + Arcade.hash(z * 53 + i) * 0.34);
      disc(g, cx2, cy2, r2, mixHex(above, '#ffffff', 0.30));
    }
  }

  // The image is stretched to the full canvas width, so its height must follow
  // the SAME factor or the art comes out squashed. Only a 540-wide source got
  // away with drawing at native height.
  //
  // MIRROR flips every other copy top to bottom. A scene with sky at the top and
  // ground at the bottom is not seamless, and tiling it plainly puts ground
  // straight above sky once per copy. Mirroring makes ground meet ground and sky
  // meet sky, so any image tiles with no join at the cost of a repeated shape.
  // A near layer has to be darker than what is behind it or it reads as more of
  // the same distance. Darkening once into an offscreen canvas keeps the cost
  // off the frame; the result is cached on the image and rebuilt only when the
  // dial moves.
  function shaded(im, pct, col) {
    if (pct <= 0) return im;
    if (im.__shadeVal !== pct || im.__shadeCol !== col) {
      var c = im.__shade || (im.__shade = document.createElement('canvas'));
      c.width = im.width; c.height = im.height;
      var x = c.getContext('2d');
      x.clearRect(0, 0, c.width, c.height);
      x.drawImage(im, 0, 0);
      x.globalCompositeOperation = 'source-atop';   // only where the art is
      x.globalAlpha = pct / 100;
      x.fillStyle = col;
      x.fillRect(0, 0, c.width, c.height);
      im.__shadeVal = pct;
      im.__shadeCol = col;
    }
    return im.__shade;
  }

  // The near layer is a fixed multiple of the far one rather than a fixed step
  // above it. That keeps the sense of depth the same at every setting, and lets
  // one dial slow the whole background instead of leaving the near layer racing.
  function nearPar() { return Math.min(0.9, (T.bgPar / 100) * 2.2); }

  function drawZoneImage(g, ctx, im, par, mirror) {
    var iw = im.width;
    var dh = Math.max(1, Math.round(im.height * (W / iw)));
    var p = S.cam * par;
    var n0 = Math.floor(p / dh);
    var off = p - n0 * dh;
    for (var y = off - dh, n = n0 + 1; y < H + dh; y += dh, n--) {
      var top = Math.round(y);
      if (mirror && (((n % 2) + 2) % 2) === 1) {
        ctx.save();
        ctx.translate(0, top + dh);
        ctx.scale(1, -1);
        ctx.drawImage(im, 0, 0, iw, im.height, 0, 0, W, dh);
        ctx.restore();
      } else {
        ctx.drawImage(im, 0, 0, iw, im.height, 0, top, W, dh);
      }
    }
  }

  function placeOf(z) { return PLACE[zidx(z, PLACE.length)]; }

  // Returns a ready-to-call backdrop for the zone, with its options bound in.
  function lookOf(z) {
    var pl = placeOf(z);
    var lk = pl.looks[zidx(T.look, pl.looks.length)];
    return function (g, C) {
      lk.f(g, C, lk.o);
      if (T.detail && pl.det) pl.det(g, C);
    };
  }

  // The place picks the materials. A little of the neighbouring place bleeds in
  // so a floor is never one note, and blue ice is always somewhere in the mix
  // because the two-hit block is what makes the climb a decision.
  function matsFor(z) {
    var pool = placeOf(z).mats.slice();
    pool.push(placeOf(z + 1).mats[0]);
    if (pool.indexOf(BLUEICE) < 0) pool.push(BLUEICE);
    return pool;
  }

  function paintRow(b, z, path) {
    if (!T.mats) return;
    var pool = matsFor(z);
    // Half strength on the ground floor, full by zone 3, so it builds without
    // ever leaving you looking at nothing but plain ice.
    var rate = T.matRate / 100 * Math.min(1, (z + 2) / 4);
    var iron = 0, powder = 0, reward = 0, obs = 0, c;
    for (c = 0; c < COLS; c++) {
      if (b[c] !== ICE || Math.abs(c - path) <= 1) continue;
      if (Math.random() > rate) continue;
      var t = pool[Math.floor(Math.random() * pool.length)];
      if (t === IRON && iron >= 2) continue;
      if (t === POWDER && powder >= 1) continue;
      if ((t === CRATE || t === GOLDORE) && reward >= 1) continue;
      if (t === OBSIDIAN && obs >= 1) continue;
      if (t === IRON) iron++;
      if (t === POWDER) powder++;
      if (t === CRATE || t === GOLDORE) reward++;
      if (t === OBSIDIAN) obs++;
      b[c] = t;
    }
  }

  function makeRow(n) {
    var z = zoneOf(n);
    var b = new Array(COLS);
    var kind = pickKind(n, z);

    if (kind === 'ground' || kind === 'solid') solidRow(b);
    else if (kind === 'zoneline') S.lastGap = zoneLineRow(b, S.lastGap);
    else if (kind === 'mixed') S.lastGap = mixedRow(z, b, S.lastGap);
    else S.lastGap = gappedRow(z, b, S.lastGap);

    paintRow(b, z, S.lastGap);
    var row = { n: n, kind: kind, z: z, b: b, d: new Array(COLS), veg: -1, topi: null };

    if (T.kit && n > 1 && kind !== 'zoneline' && Math.random() * 100 < T.vegRate) {
      row.veg = placeVeg(b, S.lastGap);
    }
    if (T.topi && z >= 2 && kind !== 'zoneline' && Math.random() < 0.24) {
      var starts = [];
      for (var i = 0; i + 2 < COLS; i++)
        if (isSolid(b[i]) && isSolid(b[i + 1]) && isSolid(b[i + 2])) starts.push(i);
      if (starts.length) {
        var s0 = starts[Math.floor(Math.random() * starts.length)];
        row.topi = { x: s0 * BW + 12, dir: Math.random() < 0.5 ? -1 : 1 };
      }
    }
    return row;
  }

  function fillRows() {
    while (rowY(S.nextN) >= S.cam - 330) {
      S.rows.push(makeRow(S.nextN));
      S.nextN++;
    }
  }

  /* ---- helpers ------------------------------------------------------- */

  function colsUnder(x) {
    var c0 = Math.floor((x + 3) / BW);
    var c1 = Math.floor((x + PW - 6) / BW);
    var out = [];
    for (var c = c0; c <= c1; c++) if (c >= 0 && c < COLS) out.push(c);
    return out;
  }

  function puff(x, y, tone, n) {
    for (var i = 0; i < (n || 5); i++) {
      S.parts.push({
        x: x, y: y,
        vx: (Math.random() * 2 - 1) * 210,
        vy: -Math.random() * 240,
        life: 0.55, tone: tone
      });
    }
  }

  /* ---- the kit ------------------------------------------------------- */

  // FOLLOW FINGER: the thumb's travel this step, amplified. Position control,
  // so no dt and no pace - the climber tracks the thumb at any game speed. The
  // cap stops one wild event from teleporting the climber; at 22px per step it
  // still allows 1320px/s, over twice the fastest held run.
  // A floating joystick: the base appears where the thumb lands, the knob is
  // the thumb, and when the thumb goes further than the ring the base is
  // dragged along behind it. That is exactly what FOLLOW does to the climber,
  // so the picture and the control agree. Faint, and gone a beat after lift.
  var JOY_R = 42, JOY_RING = 54, JOY_KNOB = 15;

  function joystickTrack(g, dt) {
    if (!T.joystick || T.control === SIDES || !g.touching) {
      if (S.joy) { S.joy.up = true; S.joy.a -= dt * 5; if (S.joy.a <= 0) S.joy = null; }
      return;
    }
    var j = S.joy;
    if (!j || j.up) { j = S.joy = { bx: g.touchX, by: g.touchY, kx: g.touchX, ky: g.touchY, a: 0, up: false }; }
    j.kx = g.touchX; j.ky = g.touchY;
    var dx = j.kx - j.bx, dy = j.ky - j.by, d = Math.sqrt(dx * dx + dy * dy);
    if (d > JOY_R) { j.bx = j.kx - dx / d * JOY_R; j.by = j.ky - dy / d * JOY_R; }
    j.a = Math.min(1, j.a + dt * 8);
    j.drag = g.touchDrag;
  }

  // Pixel-art annulus and disc: every cell of the U grid whose centre falls in
  // the band is one square, so the ring is as chunky as everything else here.
  function pixelRing(g, cx, cy, rOut, rIn, col) {
    var x0 = Math.floor((cx - rOut) / U) * U, x1 = cx + rOut;
    var y0 = Math.floor((cy - rOut) / U) * U, y1 = cy + rOut;
    for (var y = y0; y <= y1; y += U) {
      for (var x = x0; x <= x1; x += U) {
        var ddx = x + U / 2 - cx, ddy = y + U / 2 - cy, dd = Math.sqrt(ddx * ddx + ddy * ddy);
        if (dd <= rOut && dd >= rIn) g.rect(x, y, U, U, col);
      }
    }
  }

  function drawJoystick(g, ctx, P) {
    var j = S.joy;
    if (!j || j.a <= 0) return;
    ctx.globalAlpha = 0.34 * j.a;
    pixelRing(g, j.bx, j.by, JOY_RING, JOY_RING - 2 * U, P.snow);
    pixelRing(g, j.bx, j.by, 2 * U, 0, P.snow);                 // centre dot
    ctx.globalAlpha = 0.62 * j.a;
    pixelRing(g, j.kx, j.ky, JOY_KNOB, 0, P.ink2);
    pixelRing(g, j.kx, j.ky, JOY_KNOB - U, 0, P.snow);
    ctx.globalAlpha = 1;
  }

  function followDx(g) {
    if (T.control === SIDES || !g.dragDx) return 0;
    var dx = g.dragDx * T.followGain;
    if (dx > 22) dx = 22; else if (dx < -22) dx = -22;
    if (dx > 0.5) { S.faceDir = 1; S.faceT = 0.14; }
    else if (dx < -0.5) { S.faceDir = -1; S.faceT = 0.14; }
    return dx;
  }

  function runSpeed() { return T.run * (S.kit >= 1 ? 1.45 : 1); }
  function breaksRock() { return S.kit >= 2; }

  function bounceSpeed() {
    var m = 1;
    if (T.mech === STREAK) m *= 1 + Math.min(0.30, S.streak * 0.03);
    return T.jump * Math.min(1.45, m);
  }

  // One banner for both directions. Gaining a piece and losing one are the same
  // event to the player - the gear count changed - so they read from one place,
  // in one spot near the top, and only the colour says which way it went.
  // Everything the game wants to announce goes through one queue and is drawn in
  // one place. Two systems each with their own timer and their own y meant a
  // pickup message and a combo card could sit on screen at the same moment,
  // stacked on top of each other.
  function note(n) {
    if (S.notes.length >= 2) S.notes.length = 1;
    S.notes.push(n);
  }

  function banner(title, unused, bad, secs) {
    note({ kind: 'msg', text: title, bad: !!bad, t: (secs || 1) * 0.7 });
  }

  function gainVeg(g, x, y) {
    S.veg++;
    S.bonus += 5;
    puff(x, y, 'purple', 5);
    if (!T.kit || S.veg < T.kitCost) return;
    S.veg = 0;
    levelUp(g);
  }

  function levelUp(g) {
    if (S.kit >= kitMax()) {
      // Every piece is already on. Veggies still pay, just in points.
      S.bonus += 30;
      banner('KIT FULL +30', '', false, 1.0);
      g.shake = 3;
      return;
    }
    S.kit++;
    if (T.condor && S.kit >= KIT_MAX) {
      S.fly = T.flySec;
      banner('GOT ' + KIT[KIT_MAX - 1].name, '', false, 1.1);
      noteBestKit(KIT_MAX);
      S.kit = 1;
      S.bonus += 50;
    } else {
      if (S.kit === 3) S.shield = true;
      banner('GOT ' + KIT[S.kit - 1].name, '', false, 1.1);
      noteBestKit(S.kit);
      S.bonus += 20;
    }
    g.shake = 4;
  }

  function loseLevel() {
    if (S.kit > 0) S.kit--;
    if (S.kit < 3) S.shield = false;
  }

  // One pulse per swing, never one per block. A row can break two blocks at
  // once and hollow ice takes three in a chain, so firing inside the loop
  // stacks buzzes into a long rattle. buzz() records the strongest thing that
  // happened and fires once at the end, which is why the vibration reads as an
  // answer to the hit instead of noise.
  // Every pulse is a MULTIPLE of one number rather than a fixed millisecond
  // count. The shortest pulse a phone can actually render varies a lot: a Pixel
  // drives a linear actuator that needs time to start moving, so a 6ms command
  // reaches the motor and is felt as nothing at all. One dial, HAPTIC MS, moves
  // the whole scale to fit the phone in hand and keeps the relationships.
  var BUZZ = { chip: 0.55, brk: 1, per: 0.35, hold: 1.35, max: 2.8 };

  function pulse(k) { return Math.max(1, Math.round(T.hapticMs * k)); }

  // Below about 5ms every value lands within a millisecond of its neighbours and
  // the actuator cannot tell them apart, so the material scale quietly collapses
  // into one flat pulse. That is a real limit of the web API, not a bug: the
  // only remaining lever at that point is how OFTEN a pulse fires.
  function flatHaptics() { return pulse(BUZZ.max) - pulse(BUZZ.chip) < 6; }

  // The API sets how LONG, never how hard, and 1ms is the floor - anything less
  // truncates to 0, which cancels rather than softens. So once the shortest
  // pulse is still heavier than wanted, the only lever left is how OFTEN one
  // fires. EVERY HIT / BREAKS / BIG ONLY is that lever.
  var EVERY = 0, BREAKS = 1, BIG = 2;

  function buzzAllowed(kind, hits) {
    if (T.buzzOn === EVERY) return true;
    if (T.buzzOn === BREAKS) return kind === 'break';
    return kind === 'break' && hits > 1;          // BIG ONLY
  }

  // iOS Safari has no navigator.vibrate and never has. The one thing that does
  // produce a system haptic there is toggling <input type="checkbox" switch>,
  // which iOS 17.4 added: clicking its label taps the phone. The element has to
  // be really laid out - display:none makes iOS treat it as absent - so it sits
  // in a corner at 8px, fully transparent, and takes no pointer events.
  //
  // It is one fixed tap with no length. So on iOS every hit feels the same and
  // the ms below only reaches Android. A heavy break sends a second tap instead,
  // which is the closest thing to "harder" that iOS gives a web page.
  var iosLabel = null;

  function iosTap() {
    if (!iosLabel) {
      var box = document.createElement('input');
      box.type = 'checkbox';
      box.setAttribute('switch', '');
      box.id = 'dc-haptic-switch';
      box.style.cssText = 'position:fixed;bottom:0;right:0;width:8px;height:8px;opacity:0;pointer-events:none;margin:0';
      iosLabel = document.createElement('label');
      iosLabel.setAttribute('for', 'dc-haptic-switch');
      iosLabel.style.cssText = 'position:fixed;bottom:0;right:0;width:8px;height:8px;opacity:0;pointer-events:none';
      document.body.appendChild(box);
      document.body.appendChild(iosLabel);
    }
    try { iosLabel.click(); } catch (e) { /* nothing else to try */ }
  }

  function buzz(ms) {
    if (!T.haptics) return;
    if (navigator.vibrate) {
      try { navigator.vibrate(Math.round(ms)); } catch (e) { /* not supported */ }
      return;
    }
    iosTap();
    if (ms >= pulse(BUZZ.brk + BUZZ.per * 2)) setTimeout(iosTap, 70);   // a heavy break taps twice
  }

  function knock(g, dir) {
    if (S.hurt > 0 || S.fly > 0) return;
    S.hurt = 0.75;
    S.p.vy = 750;
    S.p.x += dir * 15;
    S.streak = 0;
    if (S.combo > 0) S.comboBreak = 0.5;
    S.combo = 0; S.comboT = 0; S.comboMult = 1;
    loseLevel();
    S.hitBar = 0.6;
    g.shake = 5;
    puff(S.p.x + PW / 2, S.p.y + PH / 2, 'red', 6);
    if (navigator.vibrate) { try { navigator.vibrate(10); } catch (e) { /* ignore */ } }
  }

  // Pieces carry the material's weight and count, so packed snow drifts down in
  // many small clumps and rock drops fast in a few heavy ones.
  // Fewer, bigger, heavier pieces than before, plus a low cloud of dust and a
  // handful of sparkles that drift up and twinkle out. The chunks are the weight
  // of the hit; the sparkles are the reward for it.
  // part is a MULTIPLIER, not a flag: 1 is the block coming apart, 0.4 is a chip
  // off a block that held. Only a real break earns the sparkles and the hitstop.
  function shatter(r, c, m, part) {
    var full = (part === undefined) || part >= 1;
    var n = Math.max(2, Math.round(m.n * 0.7 * (part || 1)));
    var cx = c * BW + BW / 2, cy = rowY(r.n) + BH / 2;
    var i, ang, sp;
    for (i = 0; i < n; i++) {
      S.parts.push({
        x: cx + (Math.random() * BW - BW / 2) * 0.7,
        y: cy + (Math.random() * BH - BH / 2) * 0.7,
        vx: (Math.random() * 2 - 1) * 190 * (part ? 0.6 : 1),
        vy: -Math.random() * 210 * (part ? 0.6 : 1),
        life: full ? 0.8 : 0.5, tone: m.tone, weight: m.weight * 1.35,
        size: Math.max(2, Math.round((full ? 3.4 : 1.5) * m.weight + 1))
      });
    }
    if (!full) return;                      // a chip is not a break

    for (i = 0; i < 6; i++) {               // dust, hanging low and fading fast
      S.parts.push({
        x: cx + (Math.random() * BW - BW / 2), y: cy + BH * 0.3,
        vx: (Math.random() * 2 - 1) * 90, vy: -Math.random() * 40,
        life: 0.42, tone: m.tone, weight: 0.1, size: 2, soft: true
      });
    }
    // Every bounce breaks something, so a full freeze on every break is stutter,
    // not punch. The freeze is scaled to what the block cost you: plain ice gets
    // half, a two-hit block gets all of it, obsidian giving way after three gets
    // more, and a crate or gold vein gets the full stop because it paid you.
    var big = m.hits >= 3 ? 1.35
            : (m.veg || m.bonus || m.chain) ? 1.1
            : m.hits >= 2 ? 1
            : 0.5;

    for (i = 0; i < Math.round(T.sparks * big); i++) {   // sparkles, drifting up
      ang = -Math.PI * (0.15 + Math.random() * 0.7);
      sp = 90 + Math.random() * 130;
      S.parts.push({
        x: cx + (Math.random() * 30 - 15), y: cy + (Math.random() * 14 - 7),
        vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
        life: 0.55 + Math.random() * 0.45, tone: 'sparkle', weight: -0.09, spark: true
      });
    }
    S.flashes.push({ x: c * BW, y: rowY(r.n), t: 0 });
    if (T.hitstop > 0) S.freeze = Math.max(S.freeze, T.hitstop * big / 1000);
  }

  function breakBlock(g, r, c, noChain) {
    var was = r.b[c], m = was && MAT[was], k, nc;
    r.b[c] = EMPTY;
    r.d[c] = 0;
    if (m) {
      // Counted, not awarded. One head hit can take several blocks - two under
      // your head, or hollow ice pulling its neighbours - and the whole swing
      // has to score as one thing for "two at once" to be worth anything.
      S.tallyN++;
      S.tallyPts += Math.max(1, m.hits);
      shatter(r, c, m, 1);
      teach(g, was, !!(m.veg || m.bonus));
      // after teach, so a level-up banner wins over the lesson
      if (m.veg) gainVeg(g, c * BW + BW / 2, rowY(r.n) - 12);
      if (m.bonus) {
        S.bonus += m.bonus;
        puff(c * BW + BW / 2, rowY(r.n) + BH / 2, 'goldLight', 9);
      }
      // Hollow ice pulls its neighbours down, but they do not pull theirs, so a
      // row of hollow blocks cannot cascade the whole floor away.
      if (m.chain && !noChain) {
        for (k = -1; k <= 1; k += 2) {
          nc = c + k;
          if (nc >= 0 && nc < COLS && r.b[nc] && MAT[r.b[nc]].hits > 0) breakBlock(g, r, nc, true);
        }
      }
    }
    if (r.topi && Math.floor((r.topi.x + TW / 2) / BW) === c) {
      puff(r.topi.x + TW / 2, rowY(r.n) - TH / 2, 'topi', 7);
      r.topi = null;
      S.bonus += 15;
    }
  }

  function swingHammer(g) {
    S.swing = 0.18;
    var best = null;
    for (var i = 0; i < S.rows.length; i++) {
      var r = S.rows[i];
      var bottom = rowY(r.n) + BH;
      if (bottom <= S.p.y + 18 && bottom >= S.p.y - 78) {
        if (!best || rowY(r.n) > rowY(best.n)) best = r;
      }
    }
    if (!best) return;
    var cs = colsUnder(S.p.x), hit = false;
    for (var k = 0; k < cs.length; k++) {
      var bt = best.b[cs[k]];
      if (bt === ICE || (bt === ROCK && breaksRock())) { breakBlock(g, best, cs[k]); hit = true; }
    }
    if (hit) g.shake = T.shakeHit * 1.5;
  }

  /* ---- lifecycle ----------------------------------------------------- */

  function setup(g) {
    // Read here rather than at load, so the dial rebuilds the run with the new
    // length. Nothing else is tuned to it: the zone line, the seam and the
    // place lookup all derive from this one number.
    ZONE_ROWS = T.zoneRows;
    S.rows = []; S.parts = []; S.birds = []; S.flashes = []; S.freeze = 0;
    S.bonus = 0; S.zone = 0; S.zoneFlash = 0; S.hurt = 0; S.wave = 0;
    S.dir = 1; S.streak = 0; S.swing = 0; S.lean = 0; S.face = 0; S.hitBar = 0;
    S.faceDir = 0; S.faceT = 0;
    S.joy = null;
    S.combo = 0; S.comboT = 0; S.comboMult = 1; S.punch = 0; S.levelPop = 0;
    S.notes = []; S.bestMult = 1;
    S.tallyN = 0; S.tallyPts = 0; S.comboBreak = 0;
    S.taught = {};
    S.kit = 0; S.veg = 0; S.shield = false; S.fly = 0;
    S.lastDead = -1;                    // the last unbreakable block already answered
    S.p = { x: (W - PW) / 2, y: -66, vx: 0, vy: -T.jump };
    S.cam = S.p.y - 450;
    S.bestY = S.p.y;
    S.birdT = T.hawkGap + 1;
    S.snow = 900;
    S.lastGap = 4;
    S.nextN = 0;
    fillRows();
  }

  // Teach each material once per run, the first time it actually stops you.
  // Without this a two-hit block just reads as the game ignoring your input.
  function teach(g, t, good) {
    if (S.taught[t] || !MAT[t].teach) return;
    S.taught[t] = true;
    banner(MAT[t].name + (good ? '!' : ''), '', !good, 1.0);
  }

  function headHit(g, r, by, cols) {
    var stopped = false, broke = false, deadHit = false;
    var hit = 0;                          // the strongest pulse this swing earned
    for (var k = 0; k < cols.length; k++) {
      var c = cols[k], bt = r.b[c];
      if (!bt) continue;
      var m = MAT[bt];
      if (!m.solid) continue;                       // powder: straight through
      if (m.hits === 0 || (m.pick && !breaksRock()) || T.mech === HAMMER) {
        if (m.hits === 0 || m.pick) teach(g, bt);
        // Smashing your head into something you cannot break ends the combo.
        // Reading the material is the skill the combo is actually measuring.
        if (m.hits === 0 || m.pick) {
          if (S.combo > 0) S.comboBreak = 0.5;
          S.combo = 0; S.comboT = 0; S.comboMult = 1;
          // Hitting a block you cannot break pushes you down. You fall, you
          // bounce, you hit the SAME block again, and that repeats for as long
          // as you stay under it. The first hit is real news - it says "this
          // will not work" and it ends the combo. Every repeat on the same
          // block says nothing new, so only the first one is felt.
          var id = r.n * COLS + c;
          if (id !== S.lastDead) { deadHit = true; S.lastDead = id; }
        }
        stopped = true;
        continue;
      }
      r.d[c] = (r.d[c] || 0) + 1;
      if (r.d[c] >= m.hits) {
        breakBlock(g, r, c); broke = true;
        S.lastDead = -1;
        // A tougher material gives a longer pulse, the same way the hitstop
        // already scales, so the hand feels what the eye sees.
        if (buzzAllowed('break', m.hits)) {
          hit = Math.max(hit, pulse(BUZZ.brk + (m.hits - 1) * BUZZ.per));
        }
      } else {
        teach(g, bt);
        stopped = true;
        S.lastDead = -1;
        if (!flatHaptics() && buzzAllowed('chip')) hit = Math.max(hit, pulse(BUZZ.chip));
        shatter(r, c, m, 0.4);                      // chips, the block holds
      }
    }
    if (stopped) {
      if (deadHit && buzzAllowed('stopped')) hit = Math.max(hit, pulse(BUZZ.hold));
      if (hit > 0) buzz(Math.min(pulse(BUZZ.max), hit));
      // Every shake that comes from hitting a block derives from the one dial,
      // so the ratios hold at any setting. Being stopped was a flat 4 while a
      // break was 2 - the failure hit twice as hard as the reward, and turning
      // the break down would only have widened the gap.
      S.p.y = by; S.p.vy = 120; g.shake = T.shakeHit * 2; return 'stopped';
    }
    if (broke) {
      if (hit > 0) buzz(Math.min(pulse(BUZZ.max), hit));
      if (T.mech === DRILL) S.p.vy = Math.min(S.p.vy, -T.smash);
      else { S.p.y = by; S.p.vy = -T.smash; }
      g.shake = T.shakeHit;
      return 'broke';
    }
    return 'clean';
  }

  var SIDES = 0, FOLLOW = 1, BOTH = 2;
  var CONTROL_MODE = ['sides', 'follow', 'both'];

  function update(g, dt) {
    var p = S.p;
    var i, k, r, cs;

    // The input handlers live in the runtime and read these, so they have to be
    // current before the next touch, not just at setup.
    g.control = CONTROL_MODE[T.control] || 'sides';
    g.ss = T.hires ? 2 : 1;
    joystickTrack(g, dt);

    g.noSave = !T.__isDefault();

    // Hitstop. For a moment after a block breaks nothing moves at all, which is
    // what makes the hit read as landing rather than as the block just vanishing.
    // g.t is wound back by the same amount, so frozen frames never hand the
    // avalanche free time.
    if (S.freeze > 0) {
      S.freeze -= dt;
      g.t -= dt;
      for (i = S.flashes.length - 1; i >= 0; i--) {
        S.flashes[i].t += dt;
        if (S.flashes[i].t > 0.09) S.flashes.splice(i, 1);
      }
      return;
    }
    for (i = S.flashes.length - 1; i >= 0; i--) {
      S.flashes[i].t += dt;
      if (S.flashes[i].t > 0.09) S.flashes.splice(i, 1);
    }

    var real = dt;
    S.pace = T.spdFrom + (T.spdTo - T.spdFrom) * Math.min(1, g.t / T.spdSecs);
    dt = real * S.pace;

    if (S.hitBar > 0) S.hitBar -= real;
    if (S.swing > 0) S.swing -= dt;

    if (S.fly > 0) {
      S.fly -= dt;
      p.vy = -T.flySpd;
      p.y += p.vy * dt;
      p.x += (g.held ? g.heldSide : 0) * runSpeed() * dt + followDx(g);
      if (p.x + PW < 0) p.x = W; else if (p.x > W) p.x = -PW;
      if (S.fly <= 0) p.vy = -180;
    } else {
      if (T.mech === FLIP) {
        if (g.tapped) S.dir = -S.dir;
        p.vx = S.dir * runSpeed();
      } else {
        if (T.mech === HAMMER && g.tapped && S.swing <= 0) swingHammer(g);
        p.vx = (g.held ? g.heldSide : 0) * runSpeed();
      }
      p.x += p.vx * dt + followDx(g);
      if (p.x + PW < 0) p.x = W; else if (p.x > W) p.x = -PW;
      p.vy += T.grav * dt;
      if (p.vy > 1680) p.vy = 1680;
      p.y += p.vy * dt;
    }

    // Face the side you hold and use the side view; let go and it turns back to
    // face you. FLIP never stops running, so it faces the way it is going.
    // The swap is instant on purpose: easing between two different drawings has
    // nothing to interpolate, and a timer here would only add lag to the turn.
    if (S.faceT > 0) S.faceT -= dt;
    S.face = (T.mech === FLIP) ? S.dir
           : (g.held && g.heldSide) ? g.heldSide
           : (S.faceT > 0) ? S.faceDir : 0;
    var leanTo = S.face * Math.tan(T.lean * Math.PI / 180);
    S.lean += (leanTo - S.lean) * Math.min(1, dt * 16);

    var prevTop = p.y - p.vy * dt, prevBot = prevTop + PH;

    for (i = 0; i < S.rows.length; i++) {
      r = S.rows[i];
      var ry = rowY(r.n);
      if (ry < S.cam - 180 || ry > S.cam + H + 180) continue;

      if (S.fly <= 0) {
        if (p.vy > 0 && prevBot <= ry && p.y + PH >= ry) {
          cs = colsUnder(p.x);
          for (k = 0; k < cs.length; k++) {
            if (isSolid(r.b[cs[k]])) {
              p.y = ry - PH;
              p.vy = -bounceSpeed();
              S.lean = 0;                 // stand straight the moment you land
              puff(p.x + PW / 2, ry, MAT[r.b[cs[k]]].tone, 3);
              // cracked ice holds for exactly one bounce, then drops away
              if (MAT[r.b[cs[k]]].gives) {
                teach(g, r.b[cs[k]]);
                breakBlock(g, r, cs[k]);
              }
              break;
            }
          }
        } else if (p.vy < 0) {
          var by = ry + BH;
          if (prevTop >= by && p.y <= by) {
            var res = headHit(g, r, by, colsUnder(p.x));
            if (res === 'clean') S.streak++; else S.streak = 0;
          }
        }
      }

      if (r.veg >= 0) {
        var vx = r.veg * BW + BW / 2 - 9, vy = ry - 24;
        if (p.x < vx + 21 && p.x + PW > vx && p.y < vy + 24 && p.y + PH > vy) {
          r.veg = -1;
          gainVeg(g, vx + 9, vy + 12);
        }
      }

      if (r.topi) {
        if (!T.topi) { r.topi = null; }
        else {
          var t = r.topi;
          var nx = t.x + t.dir * T.topiSpd * dt;
          var cc = Math.floor((nx + TW / 2) / BW);
          if (nx < 0 || nx + TW > W || cc < 0 || cc >= COLS || !isSolid(r.b[cc])) t.dir = -t.dir;
          else t.x = nx;
          var ty = ry - TH;
          if (p.x < t.x + TW && p.x + PW > t.x && p.y < ty + TH && p.y + PH > ty) knock(g, t.dir);
        }
      }
    }

    // Award whatever broke this frame. Doing it here rather than inside the
    // collision means every route counts: a head hit, a chain, cracked ice
    // giving way under you.
    if (S.tallyN > 0) {
      var gained = S.tallyPts * S.tallyN;      // two at once is worth four
      var wasMult = S.comboMult;
      S.combo += gained;
      S.comboT = T.comboWin;
      S.comboMult = Math.min(9, 1 + Math.floor(S.combo / T.comboStep));
      S.bonus += gained * S.comboMult;
      S.punch = 0.16;
      if (S.comboMult > wasMult) {
        S.levelPop = 0.5;
        // Only a NEW high for the run gets a card. The combo breaks and rebuilds
        // several times a run, so celebrating every x2 again meant an
        // announcement on screen half the time and none of them meant anything.
        if (S.comboMult > S.bestMult) {
          S.bestMult = S.comboMult;
          note({ kind: 'card', mult: S.comboMult, t: CARD_SECS });
        }
        g.shake = Math.max(g.shake, T.shakeHit * 1.6);
      }
      S.tallyN = 0; S.tallyPts = 0;
    }
    if (S.comboT > 0) {
      S.comboT -= real;
      if (S.comboT <= 0) { S.combo = 0; S.comboMult = 1; S.comboBreak = 0.4; }
    }
    if (S.punch > 0) S.punch -= real;
    if (S.levelPop > 0) S.levelPop -= real;
    if (S.notes.length) {
      S.notes[0].t -= real;
      if (S.notes[0].t <= 0) S.notes.shift();
    }
    if (S.comboBreak > 0) S.comboBreak -= real;

    if (p.y < S.bestY) S.bestY = p.y;
    var camTarget = p.y - 420;
    if (camTarget < S.cam) S.cam = camTarget;
    else if (camTarget > S.cam + 210) S.cam += (camTarget - S.cam - 210) * Math.min(1, dt * 5);

    var climbed = -S.bestY;
    var zNow = Math.floor(climbed / (ZONE_ROWS * T.rowGap));
    if (zNow > S.zone) {
      S.zone = zNow;
      S.bonus += 25;
      S.snow += 420 * (ZONE_ROWS / 16);            // keep the relief per floor the same
      S.zoneFlash = 1.2;
    }
    if (S.zoneFlash > 0) S.zoneFlash -= real;
    if (S.hurt > 0) S.hurt -= dt;

    if (T.snow) {
      var snowSpd = T.snowBase + Math.min(186, g.t * T.snowRamp);
      S.snow -= snowSpd * dt;
      if (S.snow > p.y + T.snowLead) S.snow = p.y + T.snowLead;
    } else {
      S.snow = p.y + 12000;
    }

    fillRows();
    for (i = S.rows.length - 1; i >= 0; i--) {
      if (rowY(S.rows[i].n) > S.cam + H + 600) S.rows.splice(i, 1);
    }

    g.score = Math.floor(climbed / 15) + S.bonus;

    if (!T.hawks) S.birds.length = 0;
    S.birdT -= dt;
    if (T.hawks && S.zone >= 1 && S.birdT <= 0) {
      S.birdT = Math.max(1.2, T.hawkGap - g.score / 160);
      var dir = Math.random() < 0.5 ? -1 : 1;
      S.birds.push({
        x: dir < 0 ? W + 36 : -36,
        y: S.cam + g.rnd(54, 312),
        vx: dir * g.rnd(102, 198),
        f: 0
      });
    }
    for (i = S.birds.length - 1; i >= 0; i--) {
      var b = S.birds[i];
      b.x += b.vx * dt;
      b.f += dt * 9;
      if (b.x < -90 || b.x > W + 90) { S.birds.splice(i, 1); continue; }
      if (p.x < b.x + HW && p.x + PW > b.x && p.y < b.y + HH && p.y + PH > b.y) {
        knock(g, b.vx < 0 ? -1 : 1);
      }
    }

    for (i = S.parts.length - 1; i >= 0; i--) {
      var q = S.parts[i];
      q.vy += 1260 * (q.weight === undefined ? 1 : q.weight) * dt;
      if (q.spark) { q.vx *= 0.97; q.vy *= 0.97; }
      q.x += q.vx * dt; q.y += q.vy * dt;
      q.life -= dt;
      if (q.life <= 0) S.parts.splice(i, 1);
    }

    if (T.snow && S.fly <= 0 && p.y + PH >= S.snow) {
      if (S.shield) {
        S.shield = false;
        loseLevel();
        p.y = S.snow - PH - 90;
        p.vy = -1500;
        S.hurt = 0.75;
        g.shake = 6;
        banner('COAT SAVED YOU', '', false, 1.0);
        S.hitBar = 0.6;
        puff(p.x + PW / 2, p.y + PH, 'snow', 10);
      } else {
        g.die();
      }
    }
  }

  /* ---- drawing ------------------------------------------------------- */

  /* ---- the five climbers --------------------------------------------- */

  function axe(r, P, x, y) {                 // two piece ice axe
    r(x, y + 3, 3, 21, P.strap);
